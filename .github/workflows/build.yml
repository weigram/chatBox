name: build

# A push and a pull request check the code; a tag also packs it for every
# platform and puts the files on a release.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  GOFLAGS: -mod=mod

jobs:
  test:
    name: vet and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true
      - run: go vet ./...
      - run: go test ./...

  build:
    name: pack ${{ matrix.platform }}
    # 打包只在打 tag 或手动触发时做：普通推送跑测试就够了。
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS packs a .app and a .dmg. Universal is both architectures
          # in one app, so one runner covers Intel and Apple silicon.
          # artifact is the artifact's name, which may hold no slash.
          - os: macos-latest
            platform: darwin/universal
            artifact: macos
          - os: ubuntu-latest
            platform: linux/amd64
            artifact: linux-amd64
          - os: ubuntu-latest
            platform: linux/arm64
            artifact: linux-arm64
          - os: windows-latest
            platform: windows/amd64
            artifact: windows-amd64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      # The Windows installer is made with NSIS; mygo downloads it when it is
      # missing, and this makes sure it is there.
      - name: Install NSIS
        if: runner.os == 'Windows'
        run: choco install nsis -y --no-progress

      # Debian packages need these on Linux.
      - name: Install packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fakeroot dpkg-dev

      - name: Build
        run: go tool mygo build -platform ${{ matrix.platform }}

      # A .app is a directory: zipping it keeps its bundle intact on the way
      # through an artifact and on a release, and that is what people unpack.
      - name: Zip the macOS app
        if: runner.os == 'macOS'
        run: |
          cd build
          for app in */*.app; do
            [ -e "$app" ] || continue
            ditto -c -k --sequesterRsrc --keepParent "$app" "${app%.app}.zip"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            build/**/*.dmg
            build/**/*.zip
            build/**/*.exe
            build/**/*.tar.gz
            build/**/*.deb
            build/**/checksums.txt
          if-no-files-found: error
          compression-level: 0

  release:
    name: publish the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: List what was built
        run: find dist -type f | sort
      - uses: softprops/action-gh-release@v2
        with:
          # Only files: a directory here is an error for the action.
          files: |
            dist/**/*.dmg
            dist/**/*.zip
            dist/**/*.exe
            dist/**/*.tar.gz
            dist/**/*.deb
            dist/**/checksums.txt
          fail_on_unmatched_files: false
          generate_release_notes: true
